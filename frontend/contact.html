<title>Contact - Jeet's Journal</title>
<link rel="stylesheet" href="css/global.css">
<style>
main { max-width: 600px; margin: 0 auto; padding: 3rem 2rem; }
h1 { font-size: 2.5rem; margin-bottom: 1rem; text-align: center; }
.subtitle { text-align: center; color: var(--text-secondary); margin-bottom: 2rem; }
.form-group { margin-bottom: 1.5rem; }
label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
input, textarea { width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-secondary); color: var(--text-primary); font-family: inherit; }
button { background: var(--accent); color: white; border: none; padding: 0.75rem 2rem; border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%; }
button:hover { background: var(--accent-hover); }
.success-msg { background: #10b981; color: white; padding: 1rem; border-radius: 6px; margin-bottom: 1.5rem; display: none; }
</style>
<script src="js/theme.js"></script>

<nav class="navbar">
  <div class="nav-container">
    <a href="index.html" class="logo">Jeet's Journal</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About Me</a></li>
      <li><a href="blogs.html">Blogs</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
  </div>
</nav>

<main>
  <h1>Get In Touch</h1>
  <p class="subtitle">Have a question or want to work together? Send me a message.</p>

  <div class="success-msg" id="success">Message sent successfully!</div>

  <form onsubmit="sendMessage(event)">
    <div class="form-group">
      <label>Name</label>
      <input type="text" id="name" required>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" required>
    </div>
    <div class="form-group">
      <label>Subject</label>
      <input type="text" id="subject">
    </div>
    <div class="form-group">
      <label>Message</label>
      <textarea id="message" rows="5" required></textarea>
    </div>
    <button type="submit">Send Message</button>
  </form>
</main>

<footer>
  <p>&copy; 2026 Jeet's Journal. All rights reserved.</p>
</footer>

<script>
async function sendMessage(e) {
  e.preventDefault();
  const data = {
    name: document.getElementById('name').value,
    email: document.getElementById('email').value,
    subject: document.getElementById('subject').value,
    message: document.getElementById('message').value
  };

  try {
    const res = await fetch('/api/contact', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });

    if (res.ok) {
      document.getElementById('success').style.display = 'block';
      e.target.reset();
      setTimeout(() => {
        document.getElementById('success').style.display = 'none';
      }, 5000);
    }
  } catch(e) {
    alert('Failed to send message');
  }
}
</script>
