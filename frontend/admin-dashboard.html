<title>Admin Dashboard - Jeet's Journal</title>
<link rel="stylesheet" href="css/global.css">
<style>
main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 2rem;
}
.dashboard-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 2rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--border);
}
.dashboard-header h1 {
  font-size: 2rem;
  color: var(--text-primary);
}
.logout-btn {
  background: #ef4444;
  color: white;
  border: none;
  padding: 0.625rem 1.25rem;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
  transition: background 0.2s;
}
.logout-btn:hover {
  background: #dc2626;
}
.tabs {
  display: flex;
  gap: 0.5rem;
  margin-bottom: 2rem;
  border-bottom: 2px solid var(--border);
}
.tab {
  background: transparent;
  border: none;
  padding: 0.75rem 1.5rem;
  cursor: pointer;
  font-weight: 600;
  color: var(--text-secondary);
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  transition: color 0.2s, border-color 0.2s;
}
.tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}
.tab:hover {
  color: var(--accent);
}
.tab-content {
  display: none;
}
.tab-content.active {
  display: block;
}
.action-bar {
  display: flex;
  gap: 1rem;
  margin-bottom: 1.5rem;
}
.btn-primary {
  background: var(--accent);
  color: white;
  border: none;
  padding: 0.625rem 1.25rem;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
  transition: background 0.2s;
}
.btn-primary:hover {
  background: var(--accent-hover);
}
.table-container {
  overflow-x: auto;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 8px;
}
table {
  width: 100%;
  border-collapse: collapse;
}
thead {
  background: var(--bg-primary);
  border-bottom: 2px solid var(--border);
}
th {
  text-align: left;
  padding: 1rem;
  font-weight: 600;
  color: var(--text-primary);
}
td {
  padding: 1rem;
  border-top: 1px solid var(--border);
  color: var(--text-secondary);
}
.badge {
  display: inline-block;
  padding: 0.25rem 0.75rem;
  border-radius: 4px;
  font-size: 0.85rem;
  font-weight: 600;
}
.badge-published {
  background: #10b981;
  color: white;
}
.badge-draft {
  background: #f59e0b;
  color: white;
}
.badge-unread {
  background: #ef4444;
  color: white;
}
.badge-read {
  background: var(--text-secondary);
  color: white;
}
.action-btns {
  display: flex;
  gap: 0.5rem;
}
.btn-edit, .btn-delete, .btn-view {
  background: transparent;
  border: 1px solid var(--border);
  padding: 0.375rem 0.75rem;
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.875rem;
  transition: all 0.2s;
  color: var(--text-primary);
}
.btn-edit:hover {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}
.btn-delete:hover {
  background: #ef4444;
  color: white;
  border-color: #ef4444;
}
.btn-view:hover {
  background: var(--bg-primary);
}
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.7);
  z-index: 1000;
  overflow-y: auto;
}
.modal.active {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem;
}
.modal-content {
  background: var(--bg-primary);
  border-radius: 12px;
  padding: 2rem;
  width: 100%;
  max-width: 700px;
  max-height: 90vh;
  overflow-y: auto;
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1.5rem;
}
.modal-header h2 {
  font-size: 1.5rem;
  color: var(--text-primary);
}
.close-modal {
  background: transparent;
  border: none;
  font-size: 1.5rem;
  cursor: pointer;
  color: var(--text-secondary);
  padding: 0;
  width: 32px;
  height: 32px;
}
.form-group {
  margin-bottom: 1.5rem;
}
.form-group label {
  display: block;
  margin-bottom: 0.5rem;
  font-weight: 600;
  color: var(--text-primary);
}
.form-group input, .form-group textarea, .form-group select {
  width: 100%;
  padding: 0.75rem;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg-secondary);
  color: var(--text-primary);
  font-family: inherit;
  font-size: 1rem;
}
.form-group textarea {
  min-height: 200px;
  resize: vertical;
}
.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
}
.checkbox-group {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.checkbox-group input[type="checkbox"] {
  width: auto;
}
.empty-state {
  text-align: center;
  padding: 3rem 1rem;
  color: var(--text-secondary);
}
.empty-state h3 {
  font-size: 1.25rem;
  margin-bottom: 0.5rem;
  color: var(--text-primary);
}
@media (max-width: 768px) {
  .form-row {
    grid-template-columns: 1fr;
  }
  .action-bar {
    flex-direction: column;
  }
  .dashboard-header {
    flex-direction: column;
    gap: 1rem;
    align-items: flex-start;
  }
}
</style>
<script src="js/theme.js"></script>

<nav class="navbar">
  <div class="nav-container">
    <a href="index.html" class="logo">Jeet's Journal</a>
    <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
  </div>
</nav>

<main>
  <div class="dashboard-header">
    <h1>Admin Dashboard</h1>
    <button class="logout-btn" onclick="handleLogout()">Logout</button>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('blogs')">Blogs</button>
    <button class="tab" onclick="switchTab('comments')">Comments</button>
    <button class="tab" onclick="switchTab('messages')">Contact Messages</button>
  </div>

  <!-- Blogs Tab -->
  <div id="blogs-tab" class="tab-content active">
    <div class="action-bar">
      <button class="btn-primary" onclick="openBlogModal()">+ New Blog Post</button>
    </div>
    <div class="table-container">
      <table id="blogs-table">
        <thead>
          <tr>
            <th>Title</th>
            <th>Category</th>
            <th>Status</th>
            <th>Likes</th>
            <th>Created</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="blogs-body">
          <tr><td colspan="6" style="text-align: center; padding: 2rem;">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Comments Tab -->
  <div id="comments-tab" class="tab-content">
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Author</th>
            <th>Comment</th>
            <th>Blog</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="comments-body">
          <tr><td colspan="4" style="text-align: center; padding: 2rem;">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Messages Tab -->
  <div id="messages-tab" class="tab-content">
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Subject</th>
            <th>Status</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="messages-body">
          <tr><td colspan="6" style="text-align: center; padding: 2rem;">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<!-- Blog Modal -->
<div id="blog-modal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modal-title">New Blog Post</h2>
      <button class="close-modal" onclick="closeBlogModal()">×</button>
    </div>
    <form id="blog-form" onsubmit="saveBlog(event)">
      <input type="hidden" id="blog-id">
      <div class="form-group">
        <label>Title *</label>
        <input type="text" id="blog-title" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Slug *</label>
          <input type="text" id="blog-slug" required>
        </div>
        <div class="form-group">
          <label>Category</label>
          <input type="text" id="blog-category" placeholder="e.g., Web Development">
        </div>
      </div>
      <div class="form-group">
        <label>Excerpt</label>
        <textarea id="blog-excerpt" rows="3" placeholder="Short summary..."></textarea>
      </div>
      <div class="form-group">
        <label>Content *</label>
        <textarea id="blog-content" required></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Tags (comma-separated)</label>
          <input type="text" id="blog-tags" placeholder="javascript, nodejs, express">
        </div>
        <div class="form-group">
          <label>Reading Time (minutes)</label>
          <input type="number" id="blog-reading-time" min="1" placeholder="5">
        </div>
      </div>
      <div class="form-group checkbox-group">
        <input type="checkbox" id="blog-published">
        <label for="blog-published" style="margin-bottom: 0;">Publish immediately</label>
      </div>
      <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem;">Save Blog Post</button>
    </form>
  </div>
</div>

<!-- Message Modal -->
<div id="message-modal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Contact Message</h2>
      <button class="close-modal" onclick="closeMessageModal()">×</button>
    </div>
    <div id="message-details"></div>
  </div>
</div>

<footer>
  <p>&copy; 2026 Jeet's Journal. All rights reserved.</p>
</footer>

<script>
const token = localStorage.getItem('adminToken');
if (!token) {
  window.location.href = 'admin-login.html';
}

const headers = {
  'Content-Type': 'application/json',
  'Authorization': `Bearer ${token}`
};

let currentTab = 'blogs';

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById(`${tab}-tab`).classList.add('active');
  currentTab = tab;

  if (tab === 'blogs') loadBlogs();
  else if (tab === 'comments') loadComments();
  else if (tab === 'messages') loadMessages();
}

function handleLogout() {
  localStorage.removeItem('adminToken');
  window.location.href = 'admin-login.html';
}

// Blogs
async function loadBlogs() {
  try {
    const res = await fetch('/api/blogs', { headers });
    const blogs = await res.json();
    const tbody = document.getElementById('blogs-body');

    if (blogs.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty-state"><h3>No blog posts yet</h3><p>Create your first post to get started</p></td></tr>';
      return;
    }

    tbody.innerHTML = blogs.map(b => `
      <tr>
        <td><strong>${b.title}</strong></td>
        <td>${b.category || '-'}</td>
        <td><span class="badge ${b.published ? 'badge-published' : 'badge-draft'}">${b.published ? 'Published' : 'Draft'}</span></td>
        <td>${b.likes || 0}</td>
        <td>${new Date(b.created_at).toLocaleDateString()}</td>
        <td>
          <div class="action-btns">
            <button class="btn-edit" onclick="editBlog(${b.id})">Edit</button>
            <button class="btn-delete" onclick="deleteBlog(${b.id}, '${b.title.replace(/'/g, "\\'")}')">Delete</button>
          </div>
        </td>
      </tr>
    `).join('');
  } catch (e) {
    document.getElementById('blogs-body').innerHTML = '<tr><td colspan="6" style="text-align: center; color: #ef4444;">Failed to load blogs</td></tr>';
  }
}

function openBlogModal(blogId = null) {
  document.getElementById('modal-title').textContent = blogId ? 'Edit Blog Post' : 'New Blog Post';
  document.getElementById('blog-form').reset();
  document.getElementById('blog-id').value = blogId || '';

  if (blogId) {
    loadBlogForEdit(blogId);
  }

  document.getElementById('blog-modal').classList.add('active');
}

function closeBlogModal() {
  document.getElementById('blog-modal').classList.remove('active');
}

async function loadBlogForEdit(id) {
  try {
    const res = await fetch('/api/blogs', { headers });
    const blogs = await res.json();
    const blog = blogs.find(b => b.id === id);

    if (blog) {
      document.getElementById('blog-title').value = blog.title;
      document.getElementById('blog-slug').value = blog.slug;
      document.getElementById('blog-category').value = blog.category || '';
      document.getElementById('blog-excerpt').value = blog.excerpt || '';
      document.getElementById('blog-content').value = blog.content;
      document.getElementById('blog-tags').value = blog.tags ? blog.tags.join(', ') : '';
      document.getElementById('blog-reading-time').value = blog.reading_time || '';
      document.getElementById('blog-published').checked = blog.published;
    }
  } catch (e) {
    alert('Failed to load blog details');
  }
}

async function saveBlog(e) {
  e.preventDefault();

  const id = document.getElementById('blog-id').value;
  const tags = document.getElementById('blog-tags').value;

  const data = {
    title: document.getElementById('blog-title').value,
    slug: document.getElementById('blog-slug').value,
    category: document.getElementById('blog-category').value || null,
    excerpt: document.getElementById('blog-excerpt').value || null,
    content: document.getElementById('blog-content').value,
    tags: tags ? tags.split(',').map(t => t.trim()).filter(t => t) : [],
    reading_time: parseInt(document.getElementById('blog-reading-time').value) || null,
    published: document.getElementById('blog-published').checked
  };

  try {
    const url = id ? `/api/blogs/${id}` : '/api/blogs';
    const method = id ? 'PUT' : 'POST';
    const res = await fetch(url, { method, headers, body: JSON.stringify(data) });

    if (res.ok) {
      closeBlogModal();
      loadBlogs();
    } else {
      const err = await res.json();
      alert(err.error || 'Failed to save blog');
    }
  } catch (e) {
    alert('Failed to save blog');
  }
}

function editBlog(id) {
  openBlogModal(id);
}

async function deleteBlog(id, title) {
  if (!confirm(`Delete blog post "${title}"?`)) return;

  try {
    const res = await fetch(`/api/blogs/${id}`, { method: 'DELETE', headers });
    if (res.ok) {
      loadBlogs();
    } else {
      alert('Failed to delete blog');
    }
  } catch (e) {
    alert('Failed to delete blog');
  }
}

// Comments
async function loadComments() {
  try {
    const blogsRes = await fetch('/api/blogs', { headers });
    const blogs = await res.json();

    let allComments = [];
    for (const blog of blogs) {
      try {
        const commentsRes = await fetch(`/api/comments/${blog.id}`, { headers });
        const comments = await commentsRes.json();
        comments.forEach(c => c.blog_title = blog.title);
        allComments = allComments.concat(comments);
      } catch (e) {}
    }

    const tbody = document.getElementById('comments-body');
    if (allComments.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" class="empty-state"><h3>No comments yet</h3></td></tr>';
      return;
    }

    tbody.innerHTML = allComments.map(c => `
      <tr>
        <td><strong>${c.author_name}</strong><br><small>${c.author_email}</small></td>
        <td>${c.comment_text.substring(0, 100)}${c.comment_text.length > 100 ? '...' : ''}</td>
        <td>${c.blog_title}</td>
        <td>${new Date(c.created_at).toLocaleDateString()}</td>
      </tr>
    `).join('');
  } catch (e) {
    document.getElementById('comments-body').innerHTML = '<tr><td colspan="4" style="text-align: center; color: #ef4444;">Failed to load comments</td></tr>';
  }
}

// Messages
async function loadMessages() {
  try {
    const res = await fetch('/api/contact', { headers });
    const messages = await res.json();
    const tbody = document.getElementById('messages-body');

    if (messages.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty-state"><h3>No messages yet</h3></td></tr>';
      return;
    }

    tbody.innerHTML = messages.map(m => `
      <tr>
        <td><strong>${m.name}</strong></td>
        <td>${m.email}</td>
        <td>${m.subject || '-'}</td>
        <td><span class="badge ${m.read ? 'badge-read' : 'badge-unread'}">${m.read ? 'Read' : 'Unread'}</span></td>
        <td>${new Date(m.created_at).toLocaleDateString()}</td>
        <td>
          <button class="btn-view" onclick="viewMessage(${m.id})">View</button>
        </td>
      </tr>
    `).join('');
  } catch (e) {
    document.getElementById('messages-body').innerHTML = '<tr><td colspan="6" style="text-align: center; color: #ef4444;">Failed to load messages</td></tr>';
  }
}

async function viewMessage(id) {
  try {
    const res = await fetch('/api/contact', { headers });
    const messages = await res.json();
    const msg = messages.find(m => m.id === id);

    if (msg) {
      document.getElementById('message-details').innerHTML = `
        <div class="form-group">
          <label>From</label>
          <p style="color: var(--text-primary); margin-top: 0.5rem;"><strong>${msg.name}</strong> (${msg.email})</p>
        </div>
        <div class="form-group">
          <label>Subject</label>
          <p style="color: var(--text-primary); margin-top: 0.5rem;">${msg.subject || 'No subject'}</p>
        </div>
        <div class="form-group">
          <label>Date</label>
          <p style="color: var(--text-primary); margin-top: 0.5rem;">${new Date(msg.created_at).toLocaleString()}</p>
        </div>
        <div class="form-group">
          <label>Message</label>
          <p style="color: var(--text-secondary); margin-top: 0.5rem; line-height: 1.6;">${msg.message}</p>
        </div>
      `;
      document.getElementById('message-modal').classList.add('active');
    }
  } catch (e) {
    alert('Failed to load message');
  }
}

function closeMessageModal() {
  document.getElementById('message-modal').classList.remove('active');
}

// Auto-generate slug from title
document.getElementById('blog-title')?.addEventListener('input', (e) => {
  if (!document.getElementById('blog-id').value) {
    const slug = e.target.value.toLowerCase()
      .replace(/[^\w\s-]/g, '')
      .replace(/\s+/g, '-')
      .replace(/-+/g, '-')
      .trim();
    document.getElementById('blog-slug').value = slug;
  }
});

// Load initial data
loadBlogs();
</script>
