<title>Blogs - Jeet's Journal</title>
<link rel="stylesheet" href="css/global.css">
<style>
main { max-width: 1100px; margin: 0 auto; padding: 3rem 2rem; }
h1 { font-size: 2.5rem; margin-bottom: 2rem; text-align: center; }
.filters { display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; }
.filters input, .filters select { padding: 0.5rem 1rem; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-secondary); color: var(--text-primary); }
.blog-grid { display: grid; gap: 1.5rem; }
.blog-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; cursor: pointer; transition: transform 0.15s; }
.blog-card:hover { transform: translateY(-2px); }
.blog-card h2 { font-size: 1.5rem; margin-bottom: 0.5rem; color: var(--accent); }
.blog-meta { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 0.75rem; }
.blog-card p { color: var(--text-secondary); margin-bottom: 1rem; }
.blog-tags { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.tag { background: var(--accent); color: white; padding: 0.25rem 0.75rem; border-radius: 4px; font-size: 0.85rem; }
</style>
<script src="js/theme.js"></script>

<nav class="navbar">
  <div class="nav-container">
    <a href="index.html" class="logo">Jeet's Journal</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About Me</a></li>
      <li><a href="blogs.html">Blogs</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
  </div>
</nav>

<main>
  <h1>All Blog Posts</h1>
  <div class="filters">
    <input type="text" id="search" placeholder="Search posts...">
    <select id="category">
      <option value="">All Categories</option>
      <option value="Web Development">Web Development</option>
      <option value="AI">AI</option>
      <option value="Technology">Technology</option>
    </select>
  </div>
  <div class="blog-grid" id="blog-list">
    <p>Loading posts...</p>
  </div>
</main>

<footer>
  <p>&copy; 2026 Jeet's Journal. All rights reserved.</p>
</footer>

<script>
let allBlogs = [];

async function loadBlogs() {
  try {
    const res = await fetch('/api/blogs');
    allBlogs = await res.json();
    renderBlogs(allBlogs);
  } catch(e) {
    document.getElementById('blog-list').innerHTML = '<p>Unable to load posts</p>';
  }
}

function renderBlogs(blogs) {
  const container = document.getElementById('blog-list');
  if (blogs.length === 0) {
    container.innerHTML = '<p>No posts found</p>';
    return;
  }
  container.innerHTML = blogs.map(b => `
    <div class="blog-card" onclick="location.href='blog-detail.html?slug=${b.slug}'">
      <h2>${b.title}</h2>
      <div class="blog-meta">${new Date(b.created_at).toLocaleDateString()} • ${b.reading_time || 5} min read</div>
      <p>${b.excerpt || ''}</p>
      ${b.tags ? `<div class="blog-tags">${b.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>` : ''}
    </div>
  `).join('');
}

document.getElementById('search').addEventListener('input', filterBlogs);
document.getElementById('category').addEventListener('change', filterBlogs);

function filterBlogs() {
  const search = document.getElementById('search').value.toLowerCase();
  const category = document.getElementById('category').value;
  const filtered = allBlogs.filter(b => {
    const matchSearch = !search || b.title.toLowerCase().includes(search) || (b.excerpt && b.excerpt.toLowerCase().includes(search));
    const matchCategory = !category || b.category === category;
    return matchSearch && matchCategory;
  });
  renderBlogs(filtered);
}

loadBlogs();
</script>
